<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f4f5">
<title>슬현's 휴무 캘린더</title>
<!-- 홈 화면에 추가했을 때 앱처럼 보이도록 -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="근무일정">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root {
    --ink: #1a1a1a;
    --muted: #8a8a8a;
    --line: #e7e7e9;
    --bg: #f4f4f5;
    --card: #ffffff;
    --off: #e5383b;
    --kia: #1b1f3b;
    --sun: #d62828;
    --sat: #2a6fdb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  .app {
    height: 100vh;
    height: 100dvh;
    max-width: 560px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: calc(env(safe-area-inset-top) + 12px) 8px calc(env(safe-area-inset-bottom) + 8px);
  }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 0 6px;
  }
  h1 { font-size: 19px; font-weight: 800; letter-spacing: -0.4px; }
  .by { font-size: 11px; color: var(--muted); font-weight: 600; }

  .nav { display: flex; align-items: center; justify-content: space-between; padding: 0 2px; }
  .nav button {
    border: 0; background: var(--card); color: var(--ink);
    width: 38px; height: 34px; border-radius: 10px;
    font-size: 17px; box-shadow: 0 0 0 1px var(--line); cursor: pointer;
  }
  .nav .mid { display: flex; align-items: center; gap: 8px; }
  .month { font-size: 17px; font-weight: 800; }
  .nav .today-btn { width: auto; height: 26px; padding: 0 9px; font-size: 11px; font-weight: 700; border-radius: 13px; }

  .cal {
    flex: 1; min-height: 0;
    display: flex; flex-direction: column;
    background: var(--card); border-radius: 14px; overflow: hidden;
    box-shadow: 0 0 0 1px var(--line);
  }
  .dow {
    display: grid; grid-template-columns: repeat(7, 1fr);
    text-align: center; font-size: 11px; font-weight: 700;
    padding: 7px 0; border-bottom: 1px solid var(--line);
  }
  .dow span:first-child { color: var(--sun); }
  .dow span:last-child { color: var(--sat); }
  .grid {
    flex: 1; min-height: 0;
    display: grid; grid-template-columns: repeat(7, 1fr); grid-template-rows: repeat(6, 1fr);
  }
  .cell {
    min-width: 0; overflow: hidden;
    display: flex; flex-direction: column; gap: 3px;
    padding: 4px 3px;
    border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
    background: var(--card); cursor: pointer;
  }
  .cell:nth-child(7n) { border-right: 0; }
  .cell:nth-last-child(-n+7) { border-bottom: 0; }
  .cell.off { background: var(--off); color: #fff; border-color: rgba(255,255,255,0.28); }
  .cell.out { opacity: 0.3; }
  .d { font-size: 12px; font-weight: 700; line-height: 18px; height: 18px; }
  .cell.sun:not(.off) .d { color: var(--sun); }
  .cell.sat:not(.off) .d { color: var(--sat); }
  .cell.today .d span {
    display: inline-block; min-width: 18px; height: 18px; border-radius: 9px; text-align: center;
    background: var(--ink); color: #fff;
  }
  .cell.off.today .d span { background: #fff; color: var(--off); }

  .game {
    border-radius: 5px; padding: 2px 3px;
    font-size: 9.5px; line-height: 1.25; letter-spacing: -0.3px;
    background: #fff; color: var(--kia);
    border: 1.5px solid var(--kia);
  }
  .game.maybe { border-style: dashed; border-width: 1px; }
  .cell.off .game { border-color: #fff; }
  .game .vs { display: flex; align-items: center; gap: 2px; font-weight: 700; font-size: 10px; height: 20px; }
  .game .vs img { height: 19px; max-width: 30px; min-width: 0; object-fit: contain; }
  .game i { display: block; font-style: normal; opacity: 0.8; white-space: nowrap; }
  .game .res { opacity: 1; font-weight: 800; }
  .game .res.L, .game .res.D { opacity: 0.55; }
  .game.cancel { opacity: 0.55; }

  .legend {
    display: flex; flex-wrap: wrap; align-items: center; gap: 4px 9px;
    font-size: 10.5px; color: #555; padding: 0 4px;
  }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .sw.work { background: #fff; box-shadow: inset 0 0 0 1px #c9c9cc; }
  .sw.off { background: var(--off); }
  .sw.game { box-shadow: inset 0 0 0 2px var(--kia); }
  .sw.maybe { border: 1px dashed var(--kia); }
  .legend .updated { flex-basis: 100%; justify-content: flex-end; color: var(--muted); font-size: 10px; }
  .legend .updated:empty { display: none; }

  .sheet-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,0.35);
    display: none; align-items: flex-end; justify-content: center; z-index: 10;
  }
  .sheet-bg.show { display: flex; }
  .sheet {
    width: 100%; max-width: 560px; background: var(--card);
    border-radius: 18px 18px 0 0;
    padding: 18px 20px calc(env(safe-area-inset-bottom) + 22px);
  }
  .sheet .grab { width: 40px; height: 4px; border-radius: 2px; background: #d4d4d8; margin: -6px auto 14px; }
  .sheet h2 { font-size: 18px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
  .tag { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 10px; }
  .tag.off { background: var(--off); color: #fff; }
  .tag.work { background: #f0f0f2; color: #333; }
  .sheet .info { margin-top: 14px; font-size: 14px; line-height: 1.7; }
  .sheet .info .stage { font-weight: 800; color: var(--kia); }
  .sheet .info .match { display: flex; align-items: center; gap: 6px; }
  .sheet .info .match img { height: 22px; max-width: 40px; object-fit: contain; }
  .sheet .info .score { font-weight: 800; }
  .sheet .info + .info { border-top: 1px solid var(--line); padding-top: 12px; }
  .sheet .info .note { font-size: 12px; color: var(--muted); }
  .sheet .none { margin-top: 12px; font-size: 14px; color: var(--muted); }
  .sheet .reset {
    display: block; width: 100%; margin-top: 16px; height: 42px;
    border: 0; border-radius: 12px; background: var(--ink); color: #fff;
    font: inherit; font-size: 14px; font-weight: 700; cursor: pointer;
  }
  .sheet .reset:disabled { background: #f0f0f2; color: var(--muted); cursor: default; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>슬현's 휴무 캘린더</h1>
    <div class="by">Made by Zealot</div>
  </header>

  <div class="nav">
    <button id="prev" aria-label="이전 달">‹</button>
    <div class="mid">
      <div class="month" id="month"></div>
      <button class="today-btn" id="today">오늘</button>
    </div>
    <button id="next" aria-label="다음 달">›</button>
  </div>

  <div class="cal" id="cal">
    <div class="dow"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
    <div class="grid" id="grid"></div>
  </div>

  <div class="legend">
    <span><i class="sw work"></i>근무</span>
    <span><i class="sw off"></i>휴무</span>
    <span><i class="sw game"></i>KIA 경기</span>
    <span><i class="sw maybe"></i>진출·필요 시</span>
    <span class="updated" id="updated"></span>
  </div>
</div>

<div class="sheet-bg" id="sheetBg">
  <div class="sheet" id="sheet"></div>
</div>

<script>
  // 4일 근무 + 2일 휴무 반복. 근무 시작일(근무 1일차)부터 세고, 그 전 날짜는 표시하지 않는다.
  // 시작일은 Firestore settings/schedule에 두고, 날짜 창의 갱신 버튼으로 바꾼다.
  // 불러오기 전이나 실패하면 기본값(2026-10-16)으로 그린다.
  const FB = 'projects/seulhyun-calendar/databases/(default)/documents';
  const DAY = 86400000;
  let START = '2026-10-16';

  // KIA 경기 일정은 games.json에서 읽는다 (GitHub Actions가 매일 03:00 KST에 KBO 공식 일정으로 갱신)
  const PARKS = {
    '광주': '광주-기아 챔피언스필드',
    '잠실': '잠실야구장',
    '대구': '대구삼성라이온즈파크',
    '수원': '수원KT위즈파크',
    '창원': '창원NC파크',
    '문학': '인천SSG랜더스필드',
    '사직': '사직야구장',
    '고척': '고척스카이돔',
    '대전': '대전한화생명볼파크',
  };
  const TEAMS = {
    'LG': 'LG 트윈스', '한화': '한화 이글스', 'SSG': 'SSG 랜더스', '삼성': '삼성 라이온즈', 'NC': 'NC 다이노스',
    'KT': 'KT 위즈', '롯데': '롯데 자이언츠', '두산': '두산 베어스', '키움': '키움 히어로즈',
  };
  let GAMES = {};
  let SEASON = 2026;
  const logo = code => code
    ? `<img src="https://6ptotvmi5753.edge.naverncp.com/KBO_IMAGE/emblem/regular/${SEASON}/emblem_${code}.png" alt="" onerror="this.remove()">`
    : '';
  const result = g => g.kia == null ? null : g.kia > g.oppScore ? 'W' : g.kia < g.oppScore ? 'L' : 'D';
  const RESULT_TEXT = { W: '승', L: '패', D: '무' };

  const pad = n => String(n).padStart(2, '0');
  const key = (y, m, d) => `${y}-${pad(m + 1)}-${pad(d)}`;
  const WD = ['일', '월', '화', '수', '목', '금', '토'];

  function status(y, m, d) {
    const [sy, sm, sd] = START.split('-').map(Number);
    const diff = Math.round((Date.UTC(y, m, d) - Date.UTC(sy, sm - 1, sd)) / DAY);
    if (diff < 0) return null;
    return diff % 6 < 4 ? 'work' : 'off';
  }

  // 선택한 날을 새 근무 1일차로 저장한다 (예전 starts 목록 필드는 지운다)
  async function resetFrom(k) {
    const res = await fetch(`https://firestore.googleapis.com/v1/${FB}/settings/schedule?updateMask.fieldPaths=start&updateMask.fieldPaths=starts`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ fields: { start: { stringValue: k } } }),
    });
    if (!res.ok) throw new Error(res.status);
    START = k;
  }

  const now = new Date();
  const todayKey = key(now.getFullYear(), now.getMonth(), now.getDate());
  let view = { y: now.getFullYear(), m: now.getMonth() };
  if (view.y < 2026 || (view.y === 2026 && view.m < 9)) view = { y: 2026, m: 9 };

  const grid = document.getElementById('grid');

  function render() {
    const { y, m } = view;
    document.getElementById('month').textContent = `${y}년 ${m + 1}월`;
    const start = new Date(y, m, 1).getDay();
    grid.innerHTML = '';
    for (let i = 0; i < 42; i++) {
      const date = new Date(y, m, 1 - start + i);
      const cy = date.getFullYear(), cm = date.getMonth(), cd = date.getDate();
      const k = key(cy, cm, cd);
      const st = status(cy, cm, cd);
      const cell = document.createElement('div');
      cell.className = 'cell';
      if (st === 'off') cell.classList.add('off');
      if (cm !== m) cell.classList.add('out');
      if (date.getDay() === 0) cell.classList.add('sun');
      if (date.getDay() === 6) cell.classList.add('sat');
      if (k === todayKey) cell.classList.add('today');
      cell.innerHTML = `<div class="d"><span>${cd}</span></div>`;
      if (cm === m) {
        for (const g of GAMES[k] || []) {
          const el = document.createElement('div');
          el.className = 'game' + (g.maybe ? ' maybe' : '') + (g.note ? ' cancel' : '');
          const r = result(g);
          const last = g.note ? '취소'
                     : r ? `<span class="res ${r}">${RESULT_TEXT[r]} ${g.kia}:${g.oppScore}</span>`
                     : g.time;
          el.innerHTML = `<div class="vs">vs${logo(g.oppCode) || ' ' + g.opp}</div><i>${g.park}</i>${last ? `<i>${last}</i>` : ''}`;
          cell.appendChild(el);
        }
      }
      cell.addEventListener('click', () => openSheet(cy, cm, cd));
      grid.appendChild(cell);
    }
  }

  const sheetBg = document.getElementById('sheetBg');
  const sheet = document.getElementById('sheet');

  function openSheet(y, m, d) {
    const k = key(y, m, d);
    const st = status(y, m, d);
    const list = GAMES[k] || [];
    const tag = st === 'off' ? '<span class="tag off">휴무</span>'
              : st === 'work' ? '<span class="tag work">근무</span>' : '';
    let body = '<div class="none">KIA 경기 없음</div>';
    if (list.length) {
      body = list.map(g => {
        const r = result(g);
        return `<div class="info">
          <div class="stage">⚾ ${g.stage}</div>
          <div class="match">${logo('HT')}KIA 타이거즈 vs ${logo(g.oppCode)}${TEAMS[g.opp] || g.opp}</div>
          ${r ? `<div class="score">${RESULT_TEXT[r]} · KIA ${g.kia} : ${g.oppScore} ${g.opp}</div>` : ''}
          <div>📍 ${PARKS[g.park] || g.park} (${g.home ? '홈' : '원정'})</div>
          ${g.time ? `<div>🕑 ${g.time}</div>` : ''}
          ${g.note ? `<div class="note">${g.note}</div>` : ''}
          ${g.maybe ? `<div class="note">${g.maybe} 열리는 경기</div>` : ''}
        </div>`;
      }).join('');
    }
    const isStart = START === k;
    sheet.innerHTML = `<div class="grab"></div>
      <h2>${m + 1}월 ${d}일 (${WD[new Date(y, m, d).getDay()]}) ${tag}</h2>${body}
      <button class="reset" id="reset"${isStart ? ' disabled' : ''}>${isStart ? '이 날이 근무 1일차예요' : '이 날부터 근무 1일차로 갱신'}</button>`;
    document.getElementById('reset').addEventListener('click', async e => {
      e.stopPropagation();
      if (!confirm(`${m + 1}월 ${d}일부터 4일 근무 · 2일 휴무로 다시 시작할까요?`)) return;
      e.target.disabled = true;
      e.target.textContent = '갱신 중…';
      try {
        await resetFrom(k);
        sheetBg.classList.remove('show');
        render();
      } catch {
        alert('갱신하지 못했어요. 잠시 후 다시 시도해 주세요.');
        e.target.disabled = false;
        e.target.textContent = '이 날부터 근무 1일차로 갱신';
      }
    });
    sheetBg.classList.add('show');
  }
  sheetBg.addEventListener('click', () => sheetBg.classList.remove('show'));

  function move(delta) {
    const t = new Date(view.y, view.m + delta, 1);
    view = { y: t.getFullYear(), m: t.getMonth() };
    render();
  }
  document.getElementById('prev').addEventListener('click', () => move(-1));
  document.getElementById('next').addEventListener('click', () => move(1));
  document.getElementById('today').addEventListener('click', () => {
    view = { y: now.getFullYear(), m: now.getMonth() };
    render();
  });

  // 좌우 스와이프로 달 이동
  let sx = null, sy = null;
  const cal = document.getElementById('cal');
  cal.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  cal.addEventListener('touchend', e => {
    if (sx === null) return;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) move(dx < 0 ? 1 : -1);
    sx = null;
  }, { passive: true });

  render();
  // "2026-10-16 07:05" -> "07:05" (오늘) / "10/16 07:05"
  const stamp = s => s.slice(0, 10) === todayKey ? s.slice(11) : s.slice(5).replace('-', '/');
  const getJson = url => fetch(url + '?t=' + Date.now(), { cache: 'no-store' }).then(r => r.json());
  Promise.all([getJson('games.json'), getJson('checked.json').catch(() => null)])
    .then(([data, check]) => {
      GAMES = data.games || {};
      SEASON = data.season || SEASON;
      const parts = [];
      if (check && check.checked) parts.push(`확인 ${stamp(check.checked)}`);
      if (data.updated) parts.push(`일정 변경 ${stamp(data.updated)}`);
      document.getElementById('updated').textContent = parts.join(' · ');
      render();
    })
    .catch(() => { document.getElementById('updated').textContent = '일정 불러오기 실패'; });

  fetch(`https://firestore.googleapis.com/v1/${FB}/settings/schedule`, { cache: 'no-store' })
    .then(r => r.ok ? r.json() : null)
    .then(doc => {
      const start = doc?.fields?.start?.stringValue;
      if (start) { START = start; render(); }
    })
    .catch(() => {});

  // 켜둔 채 날짜가 바뀌었으면 다시 화면에 나올 때 새로고침
  document.addEventListener('visibilitychange', () => {
    const d = new Date();
    if (document.visibilityState === 'visible' && key(d.getFullYear(), d.getMonth(), d.getDate()) !== todayKey) location.reload();
  });
</script>
<script>
  // 방문 기록 (Firestore: visits/{ip})
  (async () => {
    try {
      const { ip } = await (await fetch('https://api.ipify.org?format=json')).json();
      await fetch(`https://firestore.googleapis.com/v1/${FB}:commit`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ writes: [{ transform: {
          document: `${FB}/visits/${ip}`,
          fieldTransforms: [
            { fieldPath: 'count', increment: { integerValue: '1' } },
            { fieldPath: 'lastVisit', setToServerValue: 'REQUEST_TIME' }
          ]
        } }] })
      });
    } catch (e) {}
  })();
</script>
</body>
</html>
