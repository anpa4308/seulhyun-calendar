name: Update KIA schedule

on:
  schedule:
    - cron: '5 * * * *'   # every hour (minute 5 avoids the top-of-hour rush)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch KIA schedule from KBO
        id: fetch
        continue-on-error: true   # keep the last games.json if KBO is down
        shell: pwsh
        run: ./update-games.ps1

      # games.json is committed only when the schedule changed
      - name: Commit games.json
        if: steps.fetch.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games.json
          git commit -m "Update KIA schedule"
          git push

      # checked.json is never committed; it only goes into the deployed site
      - name: Record check time
        if: steps.fetch.outcome == 'success'
        run: echo "{\"checked\":\"$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')\"}" > checked.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
